<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="img/images,jpg" href="img/images.jpg">
    <title>კონტაქტი</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">მთავარი</a></li>
                <li><a href="models.html">გამორჩეული მოდელები</a></li>
                <li><a href="contact.html">კონტაქტი</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>დაგვიკავშირდით</h2>
            <p>გაქვთ კითხვები პროექტთან დაკავშირებით? მოგვწერეთ ფორმის საშუალებით:</p>
            
            <form action="#" method="get">
                <label for="name">თქვენი სახელი:</label>
                <input type="text" id="name" name="name" placeholder="სახელი" required>
                
                <label for="email">ელ-ფოსტა:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                
                <label for="message">შეტყობინება:</label>
                <textarea id="message" name="message" rows="5" placeholder="დაწერეთ თქვენი ტექსტი აქ..." required></textarea>
                
                <button type="submit">გაგზავნა</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#">Facebook</a> | 
            <a href="#">Instagram</a> | 
            <a href="mailto:test@test.com">test@test.com</a>
        </div>
        <p>&copy; 2026 პროექტი შექმნილია დამწყები დეველოპერის მიერ.</p>
    </footer>

</body>
</html>
